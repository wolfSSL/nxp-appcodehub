name: MCUXpresso for VS Code

# Builds every app as the README says (setup.sh, Import, Build) on Linux.

on:
  pull_request:
    paths:
      - 'dm-*/**'
      - 'setup.sh'
      - 'west.yml'
      - '.github/scripts/mcuxpresso_vscode_build.py'
      - '.github/workflows/mcuxpresso-vscode.yml'
      - '.github/actions/install-zephyr-sdk/**'
  push:
    branches: [main]
    paths:
      - 'dm-*/**'
      - 'setup.sh'
      - 'west.yml'
      - '.github/scripts/mcuxpresso_vscode_build.py'
      - '.github/workflows/mcuxpresso-vscode.yml'
      - '.github/actions/install-zephyr-sdk/**'
  # Nightly: a new extension release can break Import or Build with no change here.
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      extension:
        description: Extension to install (id, or id@version to pin one)
        default: NXPSemiconductors.mcuxpresso

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SDK_VERSION: '1.0.1'

jobs:
  extension:
    name: Import and build (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          path: nxp-appcodehub

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Zephyr's host prerequisites, plus VS Code's GUI libraries and Xvfb.
      - name: Install host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build device-tree-compiler gperf \
            xvfb xauth dbus-x11 libgtk-3-0t64 libnss3 libgbm1 libasound2t64 libxkbfile1 libsecret-1-0

      - name: Install the Zephyr SDK
        uses: ./nxp-appcodehub/.github/actions/install-zephyr-sdk
        with:
          version: ${{ env.SDK_VERSION }}
          dir: ${{ runner.temp }}/zephyr-sdk

      - name: Cache west modules
        uses: actions/cache@v4
        with:
          path: |
            zephyr
            modules
          key: west-modules-${{ hashFiles('nxp-appcodehub/west.yml') }}
          restore-keys: west-modules-

      # The extension is pointed at this venv (west and Zephyr's Python packages).
      - name: Set up the west workspace
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/venv"
          bin="$RUNNER_TEMP/venv/bin"
          "$bin/python" -m pip install --quiet --upgrade pip west
          [ -d .west ] || "$bin/west" init -l nxp-appcodehub
          "$bin/west" update --narrow -o=--depth=1
          "$bin/python" -m pip install --quiet -r zephyr/scripts/requirements-base.txt

      - name: Import and build every app with the extension
        env:
          EXTENSION: ${{ inputs.extension || 'NXPSemiconductors.mcuxpresso' }}
        run: |
          python nxp-appcodehub/.github/scripts/mcuxpresso_vscode_build.py \
            --west-workspace "$GITHUB_WORKSPACE" --sdk "$ZEPHYR_SDK_INSTALL_DIR" \
            --venv "$RUNNER_TEMP/venv" --out "$RUNNER_TEMP/mcux" --extension "$EXTENSION"

      - name: Upload the task results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcuxpresso-vscode
          path: |
            ${{ runner.temp }}/mcux/session
            nxp-appcodehub/dm-*/.vscode
            nxp-appcodehub/dm-*/CMakePresets.json
            nxp-appcodehub/dm-*/mcux_include.json
            nxp-appcodehub/dm-*/*/CMakeCache.txt
          if-no-files-found: warn
          retention-days: 14
