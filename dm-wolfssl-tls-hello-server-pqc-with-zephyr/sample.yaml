sample:
  description: A TLS 1.3 post-quantum (ML-DSA-44) hello server that uses the ethernet
    available on the FRDM-MCXN947
  name: TLS 1.3 Hello Server (PQC)
tests:
  sample.wolfssl.tls_hello_server_pqc:
    # Needs Ethernet and a TLS peer, so CI only builds it.
    build_only: true
    tags:
      - net
      - eth
      - tls
      - wolfssl
      - pqc
    platform_allow:
      - frdm_mcxn947/mcxn947/cpu0
    integration_platforms:
      - frdm_mcxn947/mcxn947/cpu0
