sample:
  description: A wolfTPM interactive demo with TLS server capabilities for the
    FRDM-MCXN947 (SLB9673 click on mikroBUS)
  name: wolfTPM Interactive Demo with TLS Server
tests:
  sample.wolftpm.tls:
    # Needs a TPM click board and Ethernet, so CI only builds it.
    build_only: true
    tags:
      - net
      - eth
      - tls
      - wolfssl
      - tpm
      - sd
    platform_allow:
      - frdm_mcxn947/mcxn947/cpu0
    integration_platforms:
      - frdm_mcxn947/mcxn947/cpu0
