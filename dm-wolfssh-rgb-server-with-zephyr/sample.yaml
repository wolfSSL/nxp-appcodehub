sample:
  description: An RGB light server using the SSH protocol on Zephyr
  name: RGB Light Server using SSH
tests:
  sample.wolfssh.rgb_server:
    # Needs Ethernet and an SSH client, so CI only builds it.
    build_only: true
    tags:
      - net
      - eth
      - ssh
      - wolfssh
      - gpio
    platform_allow:
      - frdm_mcxn947/mcxn947/cpu0
    integration_platforms:
      - frdm_mcxn947/mcxn947/cpu0
